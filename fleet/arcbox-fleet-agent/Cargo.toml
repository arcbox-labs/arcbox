[package]
name = "arcbox-fleet-agent"
publish = false
description = "Cross-platform Fleet runner agent: enrolls, attaches to the gateway, and runs GitHub Actions jobs"
version = "0.1.3" # x-release-please-version
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "arcbox-fleet-agent"
path = "src/main.rs"

[dependencies]
arcbox-fleet-proto = { workspace = true }
arcbox-fleet-control-proto = { workspace = true }
arcbox-logging = { workspace = true }

tonic = { workspace = true, features = ["tls-aws-lc", "tls-webpki-roots"] }
prost = { workspace = true }

tokio = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }

tracing = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dashmap = { workspace = true }
dirs = { workspace = true }
hostname = { workspace = true }
sysinfo = { workspace = true }
command-group = { version = "5.0.1", features = ["with-tokio"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
bollard = "0.21.0"
hyper-util = "0.1"
arcbox-constants.workspace = true
russh = { version = "0.62.1", default-features = false, features = ["aws-lc-rs", "flate2"] }
thiserror.workspace = true
plist = "1.10.0"
libc.workspace = true
sha2.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
uuid = { workspace = true }
arcbox-connect = { version = "0.6.0", path = "../../rpc/arcbox-connect" }
connectrpc = { git = "https://github.com/connectrpc/connect-rust", rev = "c5c1a6faa5d7f4d681662731db61e1fbe7796eec", version = "0.8.1", features = ["client"] }
hyper.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4"

[dev-dependencies]
arcbox-grpc.workspace = true
arcbox-protocol.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
