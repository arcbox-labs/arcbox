[package]
name = "arcbox-api"
description = "API server for ArcBox (gRPC + REST)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
arcbox-constants = { workspace = true }
chrono = { workspace = true }
arcbox-core = { workspace = true }
arcbox-protocol = { workspace = true }
arcbox-grpc = { workspace = true }
arcbox-docker = { workspace = true }
arcbox-error = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }
dimicon = { version = "0.2.0", features = ["devicon", "simpleicon"] }
bytes.workspace = true
arcbox-connect.workspace = true
connectrpc = "0.8.1"
buffa = { version = "0.8.1", features = ["json"] }
buffa-types = { version = "0.8.1", features = ["json"] }

[dev-dependencies]
http = "1.5.0"
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []

[lints]
workspace = true
