[package]
name = "arcbox-cli"
description = "Command-line interface for ArcBox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "arcbox_cli"
path = "src/lib.rs"

[[bin]]
name = "abctl"
path = "src/main.rs"

[dependencies]
arcbox-core = { workspace = true }
arcbox-docker = { workspace = true }
arcbox-constants = { workspace = true }
arcbox-docker-tools = { workspace = true }
arcbox-asset = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
sentry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
crossterm = { workspace = true }
libc = { workspace = true }
humantime = "2.3.0"
sha2 = "0.10"
hex = "0.4"
arcbox-helper.workspace = true
chrono.workspace = true
tar = "0.4.46"
tempfile = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
arcbox-connect.workspace = true
connectrpc = { package = "arcbox-connectrpc", version = "0.9.0-arcbox.1", features = ["client"] }
buffa = { version = "0.9.1", features = ["json"] }
tower.workspace = true
buffa-types = { version = "0.9.1", features = ["json"] }
anstream = { version = "1.0.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
hickory-proto = { version = "0.26.1", default-features = false, features = ["std"] }
macos-resolver = { workspace = true }

[features]
default = []

[dev-dependencies]
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
] }

[lints]
workspace = true
