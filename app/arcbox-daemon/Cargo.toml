[package]
name = "arcbox-daemon"
description = "ArcBox daemon process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "arcbox-daemon"
path = "src/main.rs"

[dependencies]
arcbox-api = { workspace = true }
arcbox-core = { workspace = true }
arcbox-docker = { workspace = true }
arcbox-helper = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
sentry = { workspace = true }
arcbox-logging = { workspace = true, features = ["sentry"] }
dirs = { workspace = true }
libc = { workspace = true }
arcbox-constants = { workspace = true }
arcbox-net = { workspace = true }
serde_json.workspace = true
axum = "0.8"
bytes.workspace = true
http-body-util = "0.1"
tokio-util = "0.7"
arcbox-docker-tools.workspace = true
filetime = "0.2.29"
arcbox-grpc.workspace = true
tonic-reflection = "0.14"
arcbox-transport.workspace = true
connectrpc = { version = "0.8.1", features = ["axum"] }
hyper-util = { version = "0.1.20", features = ["server", "server-auto", "server-graceful", "tokio", "http1", "http2", "service"] }
tower.workspace = true
hyper = { workspace = true, features = ["server", "http1", "http2"] }

[target.'cfg(target_os = "macos")'.dependencies]
arcbox-route.workspace = true
macos-resolver = { workspace = true }
libproc = { workspace = true }

[features]
# `vmnet` is on by default: the bridge NIC (NIC2) for host→container L3
# routing only compiles behind it, and no build pipeline passes
# `--features` — without it release daemons ship without container
# routing, `route_installed` stays false, and the desktop app falls back
# to localhost instead of *.arcbox.local domains. Failure to create the
# vmnet interface at runtime (e.g. unsigned dev builds) is non-fatal.
default = ["gic", "vmnet"]
vmnet = ["arcbox-core/vmnet"]
gic = ["arcbox-core/gic"]

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tower.workspace = true
