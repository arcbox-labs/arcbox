// Sandbox service protocol definitions.
//
// A sandbox is a short-lived, strongly-isolated microVM bound to a single
// workload (function, task, or container). Unlike MachineService VMs, a
// sandbox is decoupled from its workload: an execution exiting does NOT
// destroy the sandbox — it transitions back to READY and continues accepting
// StartExecution calls until an explicit Stop/Remove or TTL expiry.
//
// Create returns immediately with state STARTING; callers subscribe to
// Events (kind READY) or poll Inspect to learn when the sandbox is usable.
//
// Executions are addressable and resumable (CORE-55): StartExecution gives a
// process an identity that survives any client connection. Output is
// offset-addressed per channel, so a client that loses its AttachExecution
// stream re-attaches at its last offsets and re-reads without loss; stdin
// writes are offset-idempotent, so a retried WriteStdin never double-feeds
// the process. Signals, TTY resize, and exit status go through the execution
// id, never through a stream.
//
// Two services are defined:
//   - SandboxService         : lifecycle, executions, files, ports, events
//   - SandboxSnapshotService : checkpoint / restore for cold-start optimisation

syntax = "proto3";

package sandbox.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// SandboxService manages short-lived, strongly-isolated microVM sandboxes.
service SandboxService {
    // Create a sandbox and return immediately with state STARTING.
    // Subscribe to Events or poll Inspect to wait for state READY.
    rpc Create(CreateSandboxRequest) returns (CreateSandboxResponse);

    // Start an execution inside a READY sandbox and return its identity.
    // Retrying with the same execution_id and command is idempotent: the
    // existing execution is returned instead of a second process starting.
    // Consume output via AttachExecution; await the result via WaitExecution.
    rpc StartExecution(StartExecutionRequest) returns (Execution);

    // Stream an execution's output from the given per-channel offsets.
    // Buffered output replays first (from the earliest retained byte when
    // retention already dropped the requested offset — chunk offsets expose
    // the gap), then live output follows. The stream ends with an Exited
    // event. KeepAlive frames are interleaved while idle so proxies do not
    // cut the connection. Multiple concurrent attaches are allowed.
    rpc AttachExecution(AttachExecutionRequest) returns (stream ExecutionEvent);

    // Write stdin bytes at an absolute offset (offset-idempotent).
    // Bytes below the accepted count are deduplicated; an offset past the
    // accepted count fails with OUT_OF_RANGE carrying the resume point.
    rpc WriteStdin(WriteStdinRequest) returns (StdinStatus);

    // Client-streaming variant of WriteStdin for high-volume stdin. Frames
    // follow the same offset semantics; the final status is returned once.
    rpc StreamStdin(stream WriteStdinRequest) returns (StdinStatus);

    // Report how many stdin bytes the server has accepted — the offset a
    // client must resume from after a lost WriteStdin response.
    rpc GetStdinStatus(GetStdinStatusRequest) returns (StdinStatus);

    // Deliver a POSIX signal to a running execution's process group,
    // without holding any stream.
    rpc SignalExecution(SignalExecutionRequest) returns (google.protobuf.Empty);

    // Resize a TTY execution's terminal.
    rpc ResizeExecutionTty(ResizeExecutionTtyRequest) returns (google.protobuf.Empty);

    // Wait until an execution exits or the timeout elapses, then return its
    // state (a zero timeout polls). The exit status distinguishes a normal
    // exit code from death by signal.
    rpc WaitExecution(WaitExecutionRequest) returns (Execution);

    // Stop a sandbox gracefully (waits for any active execution to exit,
    // then shuts down the VM).
    rpc Stop(StopSandboxRequest) returns (google.protobuf.Empty);

    // Forcibly destroy a sandbox and release all resources immediately.
    rpc Remove(RemoveSandboxRequest) returns (google.protobuf.Empty);

    // Return the current state and metadata of a sandbox.
    rpc Inspect(InspectSandboxRequest) returns (SandboxInfo);

    // List sandboxes, optionally filtered by state or labels. Paginated.
    rpc List(ListSandboxesRequest) returns (ListSandboxesResponse);

    // Subscribe to sandbox lifecycle events. KeepAlive frames are
    // interleaved while idle so proxies do not cut the connection.
    rpc Events(SandboxEventsRequest) returns (stream WatchEventsResponse);

    // Read a file from inside a sandbox as a stream of chunks.
    // The final chunk has done == true. The sandbox must be alive
    // (READY or RUNNING). Limited to 256 MiB per file. Servers may emit
    // empty non-final chunks as keepalives.
    rpc ReadFile(ReadFileRequest) returns (stream FileChunk);

    // Write a file into a sandbox. The first message must carry `open`;
    // subsequent messages stream `chunk` payloads, the last one with
    // done == true. Limited to 256 MiB per file.
    rpc WriteFile(stream WriteFileRequest) returns (google.protobuf.Empty);

    // Expose a sandbox port on the host. The guest installs a DNAT rule from
    // a reserved guest port (40000-49999) to the sandbox, and the daemon
    // binds a host listener forwarding into the guest. Removed automatically
    // on Stop/Remove.
    rpc ExposePort(ExposePortRequest) returns (ExposePortResponse);

    // Remove a previously exposed port mapping.
    rpc UnexposePort(UnexposePortRequest) returns (google.protobuf.Empty);
}

// SandboxSnapshotService provides checkpoint / restore for cold-start
// optimisation. A snapshot captures a fully-booted, idle sandbox so that
// future sandboxes can be restored from it instead of booting from scratch.
service SandboxSnapshotService {
    // Checkpoint a sandbox into a reusable snapshot.
    // The sandbox is paused, snapshotted, then resumed automatically.
    // The sandbox must be in READY state with no active execution.
    rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse);

    // Restore a new sandbox from a previously created snapshot.
    // The restored sandbox starts in READY state; boot time is near-zero.
    rpc Restore(RestoreRequest) returns (RestoreResponse);

    // List snapshots, optionally filtered by origin sandbox or label.
    // Paginated.
    rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);

    // Delete a snapshot and its on-disk data.
    rpc DeleteSnapshot(DeleteSnapshotRequest) returns (google.protobuf.Empty);
}

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

// Lifecycle state of a sandbox.
//
// State machine:
//
//   STARTING ──► READY ──► RUNNING ──► READY  (execution exited, sandbox alive)
//                  │          │
//                  └──────────┴──► STOPPING ──► STOPPED
//                                       │
//                                    FAILED
enum SandboxState {
    SANDBOX_STATE_UNSPECIFIED = 0;
    // Firecracker process spawned; VM still booting.
    SANDBOX_STATE_STARTING = 1;
    // VM booted and accepting executions (or the last execution exited).
    SANDBOX_STATE_READY = 2;
    // An execution is currently running inside the VM.
    SANDBOX_STATE_RUNNING = 3;
    // Stop called; draining the workload and shutting down the VM.
    SANDBOX_STATE_STOPPING = 4;
    // VM has shut down cleanly.
    SANDBOX_STATE_STOPPED = 5;
    // Unrecoverable error occurred.
    SANDBOX_STATE_FAILED = 6;
}

// Kind of a sandbox lifecycle event.
enum SandboxEventKind {
    SANDBOX_EVENT_KIND_UNSPECIFIED = 0;
    // Sandbox record created, VM booting.
    SANDBOX_EVENT_KIND_CREATED = 1;
    // VM booted, sandbox accepting executions.
    SANDBOX_EVENT_KIND_READY = 2;
    // An execution started.
    SANDBOX_EVENT_KIND_RUNNING = 3;
    // The active execution exited; sandbox back to READY. Attributes carry
    // "exit_code" (shell convention) and "signal" when killed by one, or
    // "error" when the session broke before an exit was observed.
    SANDBOX_EVENT_KIND_IDLE = 4;
    // Stop called, draining the workload.
    SANDBOX_EVENT_KIND_STOPPING = 5;
    // VM shut down.
    SANDBOX_EVENT_KIND_STOPPED = 6;
    // Unrecoverable error; attributes carry "error".
    SANDBOX_EVENT_KIND_FAILED = 7;
    // Sandbox deleted.
    SANDBOX_EVENT_KIND_REMOVED = 8;
}

// Lifecycle state of an execution.
enum ExecutionState {
    EXECUTION_STATE_UNSPECIFIED = 0;
    EXECUTION_STATE_RUNNING = 1;
    EXECUTION_STATE_EXITED = 2;
}

// Stdio channel of an execution output chunk. Offsets are tracked per
// channel. A TTY execution produces one merged stream on PTY (stdout and
// stderr are indistinguishable once a terminal is allocated); non-TTY
// executions produce STDOUT and STDERR.
enum StdioChannel {
    STDIO_CHANNEL_UNSPECIFIED = 0;
    STDIO_CHANNEL_STDOUT = 1;
    STDIO_CHANNEL_STDERR = 2;
    STDIO_CHANNEL_PTY = 3;
}

// Sandbox network mode.
enum NetworkMode {
    // Daemon default (currently ENABLED).
    NETWORK_MODE_UNSPECIFIED = 0;
    // Networked sandbox with an IP from the sandbox pool.
    NETWORK_MODE_ENABLED = 1;
    // No network device.
    NETWORK_MODE_NONE = 2;
}

// Transport protocol of an exposed port.
enum PortProtocol {
    // Defaults to TCP.
    PORT_PROTOCOL_UNSPECIFIED = 0;
    PORT_PROTOCOL_TCP = 1;
    PORT_PROTOCOL_UDP = 2;
}

// Deliverable POSIX signals. Values match the POSIX signal numbers.
enum Signal {
    SIGNAL_UNSPECIFIED = 0;
    SIGNAL_SIGHUP = 1;
    SIGNAL_SIGINT = 2;
    SIGNAL_SIGQUIT = 3;
    SIGNAL_SIGKILL = 9;
    SIGNAL_SIGUSR1 = 10;
    SIGNAL_SIGUSR2 = 12;
    SIGNAL_SIGTERM = 15;
}

// ---------------------------------------------------------------------------
// Resource primitives
// ---------------------------------------------------------------------------

// Network configuration for a sandbox.
message NetworkSpec {
    // Network mode (UNSPECIFIED = daemon default).
    NetworkMode mode = 1;
}

// A single bind mount into the sandbox.
message Mount {
    // Source path on the host.
    string source = 1;
    // Target path inside the sandbox.
    string target = 2;
    // Mount read-only.
    bool readonly = 3;
}

// CPU and memory resource limits.
message ResourceLimits {
    // Number of vCPUs (0 = daemon default).
    uint32 vcpus = 1;
    // Memory in MiB (0 = daemon default).
    uint64 memory_mib = 2;
}

// Terminal size for TTY executions.
message TerminalSize {
    // Terminal width in columns.
    uint32 width = 1;
    // Terminal height in rows.
    uint32 height = 2;
}

// How a process terminated: a normal exit code or death by signal.
// Exactly one is set once the execution has exited.
message ExitStatus {
    oneof status {
        // The process exited normally with this code.
        int32 code = 1;
        // The process was killed by this POSIX signal.
        int32 signal = 2;
    }
}

// An empty frame keeping an otherwise idle stream alive through proxies and
// load balancers.
message KeepAlive {}

// ---------------------------------------------------------------------------
// CreateSandbox
// ---------------------------------------------------------------------------

// Request to create a sandbox.
message CreateSandboxRequest {
    // Caller-supplied unique ID for idempotent creation.
    // If empty the daemon generates a UUID.
    string id = 1;

    // Arbitrary key-value metadata (used for filtering in List / Events).
    map<string, string> labels = 2;

    // --- VM image ---
    // Kernel image path (empty = daemon default).
    string kernel = 3;
    // Root filesystem image path (empty = daemon default).
    string rootfs = 4;
    // Kernel command-line arguments (empty = daemon default).
    string boot_args = 5;

    // --- Resources ---
    ResourceLimits limits = 6;

    // --- Initial workload (optional) ---
    // OCI image reference. NOT supported in Sandbox V1: a non-empty value is
    // rejected with FAILED_PRECONDITION. Build the rootfs from a local
    // Docker image instead (CLI --from-image resolves the overlay2 layer and
    // passes it as `rootfs`). Registry pull lands with a rustls-capable
    // oci2rootfs release.
    string image = 7;
    // Initial command launched automatically after boot.
    // Empty = sandbox enters READY without running anything.
    // When this process exits the sandbox transitions back to READY
    // (NOT destroyed) and continues accepting executions.
    repeated string cmd = 8;
    // Environment variables for the initial command.
    map<string, string> env = 9;
    // Working directory for the initial command.
    string working_dir = 10;
    // User to run the initial command as.
    string user = 11;

    // --- Filesystem ---
    // NOT supported in Sandbox V1: a non-empty list is rejected with
    // FAILED_PRECONDITION. Copy files in with WriteFile / `sandbox cp`.
    repeated Mount mounts = 12;

    // --- Network ---
    NetworkSpec network = 13;

    // --- Lifecycle ---
    // Sandbox auto-destruction timeout in seconds (0 = no limit).
    // The timer starts from the moment the sandbox is created and is not
    // reset by workload activity.
    uint32 ttl_seconds = 14;

    // --- Provisioning ---
    // NOT supported in Sandbox V1: a set value is rejected with
    // FAILED_PRECONDITION. Use executions for interactive access.
    optional string ssh_public_key = 15;

    reserved 16;
}

// Response to CreateSandbox.
// Returned immediately; the sandbox may still be booting (state STARTING).
message CreateSandboxResponse {
    // Assigned or caller-supplied sandbox ID.
    string id = 1;
    // IP address pre-allocated for the sandbox (empty when network mode is
    // NONE). Available even while state is STARTING.
    string ip_address = 2;
    // State at time of response: always STARTING.
    SandboxState state = 3;
}

// ---------------------------------------------------------------------------
// Executions
// ---------------------------------------------------------------------------

// The state of an execution — the resource all execution RPCs address.
message Execution {
    // Execution ID, unique within its sandbox.
    string id = 1;
    // Owning sandbox.
    string sandbox_id = 2;
    // Current state.
    ExecutionState state = 3;
    // Whether the process runs on a pseudo-TTY.
    bool tty = 4;
    // When the process was dispatched.
    google.protobuf.Timestamp started_at = 5;
    // When the process terminated (unset while running).
    google.protobuf.Timestamp exited_at = 6;
    // How the process terminated. Unset while running, and also when the
    // execution ended without an observed exit (see `error`).
    ExitStatus exit_status = 7;
    // Set when the execution ended without an observed exit (e.g. the
    // sandbox stopped or the in-guest session broke).
    string error = 8;
    // Total bytes produced on stdout/PTY so far (monotonic; the high-water
    // offset for AttachExecution resume).
    uint64 stdout_len = 9;
    // Total bytes produced on stderr so far.
    uint64 stderr_len = 10;
    // Stdin acceptance state.
    StdinStatus stdin = 11;
}

// Request to start an execution.
message StartExecutionRequest {
    // Target sandbox. Must be READY.
    string sandbox_id = 1;
    // Caller-supplied execution ID (unique within the sandbox) making the
    // start idempotent across retries. Empty = server generates a UUID.
    string execution_id = 2;
    // Command and arguments.
    repeated string cmd = 3;
    // Environment variable overrides.
    map<string, string> env = 4;
    // Working directory (empty = rootfs default).
    string working_dir = 5;
    // User to run as (empty = rootfs default).
    string user = 6;
    // Allocate a pseudo-TTY. Output then arrives on the PTY channel and
    // stdin cannot be closed via `eof` (send Ctrl-D instead).
    bool tty = 7;
    // Initial terminal size (only meaningful when tty == true).
    TerminalSize tty_size = 8;
    // Kill the process after this many seconds (0 = no timeout).
    uint32 timeout_seconds = 9;
    // Keep stdin open for WriteStdin. When false the process starts with
    // stdin already at EOF (run semantics).
    bool stdin = 10;
}

// Request to attach to an execution's output.
message AttachExecutionRequest {
    // Owning sandbox.
    string sandbox_id = 1;
    // Execution to attach to.
    string execution_id = 2;
    // Resume offset for the stdout/PTY channel (0 = from the beginning of
    // the retained buffer).
    uint64 stdout_offset = 3;
    // Resume offset for the stderr channel.
    uint64 stderr_offset = 4;
}

// One frame of an AttachExecution stream.
message ExecutionEvent {
    oneof event {
        // First frame of every attach: the execution's current state.
        ExecutionStarted started = 1;
        // A chunk of process output.
        ExecutionOutput output = 2;
        // Final frame: the execution terminated.
        ExecutionExited exited = 3;
        // Idle-stream keepalive; carries no data.
        KeepAlive keep_alive = 4;
    }
}

// Attach preamble carrying the execution's state at attach time.
message ExecutionStarted {
    Execution execution = 1;
}

// An offset-addressed chunk of execution output.
message ExecutionOutput {
    // Source channel (PTY for tty executions, STDOUT/STDERR otherwise).
    StdioChannel channel = 1;
    // Absolute offset of data[0] within the channel's byte stream. May be
    // greater than the requested resume offset when retention already
    // dropped older bytes — the jump is the client's signal of a gap.
    uint64 offset = 2;
    // Raw output bytes.
    bytes data = 3;
}

// Final frame of an attach stream: the execution's terminal state,
// including exit_status / error and the final channel lengths.
message ExecutionExited {
    Execution execution = 1;
}

// Request to write stdin bytes at an absolute offset.
message WriteStdinRequest {
    // Owning sandbox.
    string sandbox_id = 1;
    // Target execution.
    string execution_id = 2;
    // Absolute offset of data[0] within the stdin byte stream. Bytes below
    // the server's accepted count are deduplicated (idempotent retry); an
    // offset above it fails with OUT_OF_RANGE.
    uint64 offset = 3;
    // Bytes to feed to the process's stdin.
    bytes data = 4;
    // Close stdin after this write. Rejected for TTY executions — send
    // Ctrl-D (0x04) as data instead.
    bool eof = 5;
}

// Stdin acceptance state.
message StdinStatus {
    // Bytes accepted and forwarded so far — the offset the next
    // WriteStdin must start at.
    uint64 bytes_written = 1;
    // Whether stdin has been closed.
    bool closed = 2;
}

// Request for the current stdin acceptance state.
message GetStdinStatusRequest {
    string sandbox_id = 1;
    string execution_id = 2;
}

// Request to signal a running execution.
message SignalExecutionRequest {
    string sandbox_id = 1;
    string execution_id = 2;
    // Signal to deliver to the process group.
    Signal signal = 3;
}

// Request to resize a TTY execution's terminal.
message ResizeExecutionTtyRequest {
    string sandbox_id = 1;
    string execution_id = 2;
    TerminalSize size = 3;
}

// Request to wait for an execution to exit.
message WaitExecutionRequest {
    string sandbox_id = 1;
    string execution_id = 2;
    // Give up after this many seconds and return the current state
    // (0 = return immediately — a poll).
    uint32 timeout_seconds = 3;
}

// ---------------------------------------------------------------------------
// File I/O
// ---------------------------------------------------------------------------

// Request to read a file from a sandbox.
message ReadFileRequest {
    // Sandbox ID.
    string id = 1;
    // Absolute path inside the sandbox rootfs.
    string path = 2;
}

// One chunk of file data in a ReadFile / WriteFile stream.
message FileChunk {
    // Raw bytes (may be empty on the final chunk, or on a keepalive).
    bytes data = 1;
    // True on the last chunk of the stream.
    bool done = 2;
}

// Opens a WriteFile stream. Must be the first WriteFileRequest message.
message WriteFileOpen {
    // Sandbox ID.
    string id = 1;
    // Absolute destination path inside the sandbox rootfs.
    string path = 2;
    // Unix permission bits for the created file (0 = 0644).
    uint32 mode = 3;
}

// A single client message in a WriteFile stream.
message WriteFileRequest {
    oneof payload {
        // Stream header — sandbox, path, and mode.
        WriteFileOpen open = 1;
        // File content chunk; the last one has done == true.
        FileChunk chunk = 2;
    }
}

// ---------------------------------------------------------------------------
// Port exposure
// ---------------------------------------------------------------------------

// Request to expose a sandbox port on the host.
message ExposePortRequest {
    // Sandbox ID.
    string id = 1;
    // Port the workload listens on inside the sandbox.
    uint32 sandbox_port = 2;
    // Host port to bind (0 = reuse the allocated guest relay port).
    uint32 host_port = 3;
    // Transport protocol (UNSPECIFIED = TCP).
    PortProtocol protocol = 4;
}

// Response to ExposePort.
message ExposePortResponse {
    // Host port the service is reachable on (via loopback).
    uint32 host_port = 1;
    // Reserved-range guest port carrying the DNAT relay.
    uint32 guest_port = 2;
}

// Request to remove an exposed port mapping.
message UnexposePortRequest {
    // Sandbox ID.
    string id = 1;
    // The sandbox port previously passed to ExposePort.
    uint32 sandbox_port = 2;
    // Transport protocol (UNSPECIFIED = TCP).
    PortProtocol protocol = 3;
}

// --- agent wire payloads (vsock, not served over gRPC) ---

// Ask the guest agent to DNAT a reserved guest port to a sandbox port.
message SandboxPortForwardRequest {
    // Sandbox ID.
    string id = 1;
    // Destination port inside the sandbox.
    uint32 sandbox_port = 2;
    // Transport protocol (UNSPECIFIED = TCP).
    PortProtocol protocol = 3;
}

// Guest agent's answer: the allocated reserved-range guest port.
message SandboxPortForwardResponse {
    // Guest port now DNATed to the sandbox.
    uint32 guest_port = 1;
}

// Ask the guest agent to remove a DNAT mapping.
message SandboxPortForwardRemoveRequest {
    // Sandbox ID.
    string id = 1;
    // The sandbox port previously forwarded.
    uint32 sandbox_port = 2;
    // Transport protocol (UNSPECIFIED = TCP).
    PortProtocol protocol = 3;
}

// ---------------------------------------------------------------------------
// Stop / Remove
// ---------------------------------------------------------------------------

// Request to stop a sandbox gracefully.
message StopSandboxRequest {
    // Sandbox ID.
    string id = 1;
    // Seconds to wait for any active execution to exit before force-killing
    // the VM (0 = daemon default of 30 s).
    uint32 timeout_seconds = 2;
}

// Request to forcibly remove a sandbox.
message RemoveSandboxRequest {
    // Sandbox ID.
    string id = 1;
    // Force removal even if the sandbox is in RUNNING state.
    bool force = 2;
}

// ---------------------------------------------------------------------------
// Inspect / List
// ---------------------------------------------------------------------------

// Request to inspect a sandbox.
message InspectSandboxRequest {
    // Sandbox ID.
    string id = 1;
}

// Full sandbox state. See SandboxState for the state machine.
message SandboxInfo {
    // Sandbox ID.
    string id = 1;
    // Lifecycle state.
    SandboxState state = 2;
    // User-supplied labels.
    map<string, string> labels = 3;
    // Effective resource limits.
    ResourceLimits limits = 4;
    // Network information.
    SandboxNetwork network = 5;
    // Creation time.
    google.protobuf.Timestamp created_at = 6;
    // When the sandbox first became READY (unset if not yet).
    google.protobuf.Timestamp ready_at = 7;
    // When the last execution exited (unset if none has run).
    google.protobuf.Timestamp last_exited_at = 8;
    // How the last execution terminated (unset if none has run, or when the
    // last execution ended without an observed exit).
    ExitStatus last_exit_status = 9;
    // Human-readable error message (only set when state == FAILED).
    string error = 10;
}

// Network details of a sandbox.
message SandboxNetwork {
    // Assigned IP address.
    string ip_address = 1;
    // Gateway address.
    string gateway = 2;
    // TAP interface name on the host.
    string tap_name = 3;
}

// Request to list sandboxes.
message ListSandboxesRequest {
    // Filter by state (UNSPECIFIED = all states).
    SandboxState state = 1;
    // Filter by labels (all key-value pairs must match).
    map<string, string> labels = 2;
    // Maximum entries per page (0 = server default of 100; capped at 1000).
    uint32 page_size = 3;
    // Continuation token from a previous response (empty = first page).
    string page_token = 4;
}

// Response to ListSandboxes.
message ListSandboxesResponse {
    repeated SandboxSummary sandboxes = 1;
    // Token for the next page; empty when this is the last page.
    string next_page_token = 2;
}

// Lightweight sandbox summary for List.
message SandboxSummary {
    // Sandbox ID.
    string id = 1;
    // Lifecycle state.
    SandboxState state = 2;
    // Labels.
    map<string, string> labels = 3;
    // IP address.
    string ip_address = 4;
    // Creation time.
    google.protobuf.Timestamp created_at = 5;
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------

// Request to subscribe to sandbox lifecycle events.
message SandboxEventsRequest {
    // Filter by sandbox ID (empty = all sandboxes).
    string sandbox_id = 1;
    // Filter by event kind (UNSPECIFIED = all kinds).
    SandboxEventKind kind = 2;
}

// One frame of an Events stream.
message WatchEventsResponse {
    oneof payload {
        // A lifecycle event.
        SandboxEvent event = 1;
        // Idle-stream keepalive; carries no data.
        KeepAlive keep_alive = 2;
    }
}

// A sandbox lifecycle event.
message SandboxEvent {
    // Sandbox ID.
    string sandbox_id = 1;
    // What happened; see SandboxEventKind for per-kind attributes.
    SandboxEventKind kind = 2;
    // When it happened.
    google.protobuf.Timestamp time = 3;
    // Additional context (e.g. "exit_code" / "signal" on IDLE,
    // "error" on FAILED).
    map<string, string> attributes = 4;
}

// ---------------------------------------------------------------------------
// Checkpoint / Restore
// ---------------------------------------------------------------------------

// Request to checkpoint a sandbox.
// The sandbox must be in READY state (no active execution).
message CheckpointRequest {
    // Sandbox ID to checkpoint.
    string sandbox_id = 1;
    // Human-readable label for the snapshot.
    string name = 2;
    // Labels attached to the snapshot.
    map<string, string> labels = 3;
}

// Response to Checkpoint.
message CheckpointResponse {
    // Snapshot ID.
    string snapshot_id = 1;
    // On-disk directory containing vmstate and mem files.
    string snapshot_dir = 2;
    // Creation time.
    google.protobuf.Timestamp created_at = 3;
}

// Request to restore a sandbox from a snapshot.
//
// Direct-mode (non-jailer) limitation: the snapshot's vmstate records the
// origin sandbox's absolute vsock socket path, so concurrent restores from
// the same snapshot — or restoring while the origin sandbox is still
// running — fail with FAILED_PRECONDITION on the vsock conflict. Jailer
// mode restores into per-sandbox chroots and has no such constraint.
message RestoreRequest {
    // Caller-supplied ID for the new sandbox (empty = auto-generated).
    string id = 1;
    // Source snapshot ID.
    string snapshot_id = 2;
    // Labels to assign to the restored sandbox.
    map<string, string> labels = 3;
    // Assign a fresh TAP interface and IP. Required when running multiple
    // sandboxes restored from the same snapshot concurrently.
    bool network_override = 4;
    // TTL for the restored sandbox in seconds (0 = no limit).
    uint32 ttl_seconds = 5;
}

// Response to Restore.
// The restored sandbox starts in READY state immediately.
message RestoreResponse {
    // ID of the newly created sandbox.
    string id = 1;
    // Allocated IP address.
    string ip_address = 2;
}

// Request to list snapshots.
message ListSnapshotsRequest {
    // Filter by the origin sandbox ID (empty = all).
    string sandbox_id = 1;
    // Filter by labels.
    map<string, string> labels = 2;
    // Maximum entries per page (0 = server default of 100; capped at 1000).
    uint32 page_size = 3;
    // Continuation token from a previous response (empty = first page).
    string page_token = 4;
}

// Response to ListSnapshots.
message ListSnapshotsResponse {
    repeated SnapshotSummary snapshots = 1;
    // Token for the next page; empty when this is the last page.
    string next_page_token = 2;
}

// Lightweight snapshot summary.
message SnapshotSummary {
    // Snapshot ID.
    string id = 1;
    // ID of the sandbox that was checkpointed.
    string sandbox_id = 2;
    // Human-readable label.
    string name = 3;
    // Labels.
    map<string, string> labels = 4;
    // On-disk directory.
    string snapshot_dir = 5;
    // Creation time.
    google.protobuf.Timestamp created_at = 6;
}

// Request to delete a snapshot.
message DeleteSnapshotRequest {
    // Snapshot ID.
    string snapshot_id = 1;
}
