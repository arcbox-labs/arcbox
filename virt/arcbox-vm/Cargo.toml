[package]
name              = "arcbox-vm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description       = "Sandbox orchestration over Firecracker microVMs: boot, exec, files, checkpoints, warm pools. The in-sandbox init is arcbox-vm-agent; the wire vocabulary is arcbox-vm-proto."

[dependencies]
arcbox-atomic-file.workspace = true
arcbox-vm-proto.workspace = true
arcbox-vm-driver.workspace = true
arcbox-error.workspace = true
arcbox-snapshot.workspace = true
fc-sdk.workspace       = true
arcbox-fc-driver.workspace = true
tokio.workspace        = true
thiserror.workspace    = true
anyhow.workspace       = true
async-trait.workspace  = true
serde.workspace        = true
serde_json.workspace   = true
uuid.workspace         = true
tracing.workspace      = true
nix            = { workspace = true, features = ["process", "term", "signal", "mount"] }
libc.workspace         = true
chrono.workspace       = true
toml.workspace         = true
sha2.workspace         = true
oci2rootfs = { version = "0.2.1", default-features = false }
arcbox-ext4 = "0.1.2"

[dev-dependencies]
arcbox-snapshot = { workspace = true, features = ["test-probe"] }
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
anyhow.workspace   = true
tracing-subscriber.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14.0"
