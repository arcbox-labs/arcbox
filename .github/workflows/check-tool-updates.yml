name: Check Toolchain Updates

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    name: Check for tool updates
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check and update tool versions
        id: update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if cargo xtask release check-tool-updates > /tmp/updates.txt; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            exit_code=$?
            if [ $exit_code -eq 2 ]; then
              echo "has_updates=false" >> "$GITHUB_OUTPUT"
            else
              exit $exit_code
            fi
          fi

      # One branch, reused. The branch name used to carry the date and run id,
      # so every Monday that found an update opened ANOTHER pull request
      # against the same file and nothing closed the previous one — #460, #542
      # and #587 were three stacked proposals for the same three tools, each
      # stale the moment the next arrived. A fixed branch force-pushed from
      # master means the open PR always shows the current latest-stable set;
      # anything hand-committed onto it is overwritten, which is the right
      # trade for a regenerated lockfile.
      - name: Open or update the toolchain pull request
        if: steps.update.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="chore/bump-toolchain"
          git config user.name "arcbox-bot[bot]"
          git config user.email "arcbox-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add assets.lock
          git commit -m "chore(tools): bump Docker toolchain to latest stable versions"
          git push --force -u origin "$BRANCH"

          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            echo "::notice::updated the open toolchain PR in place"
            exit 0
          fi

          # The reviewer prompt is not decoration: this job only sees the host
          # half. The guest dockerd ships in the boot bundle pinned by
          # `[boot]`, in another repo on another cadence, and assets.lock's own
          # header asks for the two to move together.
          gh pr create \
            --title "chore(tools): bump Docker toolchain to latest stable versions" \
            --body "$(printf '## Summary\n\n%s\n\nChecksums verified by downloading binaries and computing SHA-256.\n\n**Before merging a `docker` bump**: check it against the guest dockerd in the boot bundle `[boot]` pins (`upstream.toml` at that tag in the boot-assets repo). See the header of `assets.lock` — the two are meant to diverge only between a bundle release and the `[boot]` bump. buildx and compose have no guest-side twin.\n\n> Auto-generated by `cargo xtask release check-tool-updates`.' "$(cat /tmp/updates.txt)")"
