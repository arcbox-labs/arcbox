name: Release Please

on:
  push:
    branches:
      - master

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

      # Regenerate Cargo.lock on every open release PR so its release tag
      # can build with --locked. The release-please `prs` output only
      # includes PRs created or updated during the current run.
      - name: Update Cargo.lock on release PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global user.name "arcbox-labs[bot]"
          git config --global user.email "254083426+arcbox-labs[bot]@users.noreply.github.com"
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base "$GITHUB_REF_NAME" \
            --state open \
            --label "autorelease: pending" \
            --limit 100 \
            --json headRefName,number |
          jq -c '.[]' |
          while read -r pr; do
            PR_BRANCH=$(jq -r '.headRefName' <<< "$pr")
            PR_NUMBER=$(jq -r '.number' <<< "$pr")
            echo "::group::Update Cargo.lock for PR #${PR_NUMBER} (${PR_BRANCH})"
            workdir=$(mktemp -d)
            git clone --depth 1 --branch "$PR_BRANCH" \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$workdir"
            (
              cd "$workdir"
              cargo update --workspace
              if git diff --quiet Cargo.lock; then
                echo "Cargo.lock already up to date"
              else
                git add Cargo.lock
                git commit -m "chore: update Cargo.lock for release"
                git push
              fi
            )
            rm -rf "$workdir"
            echo "::endgroup::"
          done

  # Update arcbox-desktop version file when a new release is created.
  update-desktop:
    name: Update arcbox-desktop
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          repositories: arcbox-desktop

      - name: Update arcbox-desktop version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          BRANCH="chore/bump-arcbox-${TAG}"

          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/arcboxlabs/arcbox-desktop.git" \
            /tmp/arcbox-desktop
          cd /tmp/arcbox-desktop
          git config user.name "arcbox-labs[bot]"
          git config user.email "254083426+arcbox-labs[bot]@users.noreply.github.com"

          CURRENT=$(cat arcbox.version | tr -d '[:space:]')
          if [ "$CURRENT" = "$TAG" ]; then
            echo "arcbox-desktop already at $TAG, skipping."
            exit 0
          fi

          git checkout -b "$BRANCH"
          echo "$TAG" > arcbox.version
          git add arcbox.version
          git commit -m "chore: bump arcbox version to ${TAG}"
          git push origin "$BRANCH"

          gh pr create \
            --repo arcboxlabs/arcbox-desktop \
            --base master \
            --head "$BRANCH" \
            --title "chore: bump arcbox version to ${TAG}" \
            --body "Automated update from [arcbox ${TAG}](https://github.com/arcboxlabs/arcbox/releases/tag/${TAG})."
