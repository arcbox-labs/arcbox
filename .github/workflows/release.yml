name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.5)'
        required: true
        type: string
      publish_crates:
        description: 'Publish missing workspace crates to crates.io'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  APPLE_TEAM_ID: "422ACSY6Y5"

jobs:
  # ==========================================================================
  # Determine version (shared by all jobs)
  # ==========================================================================
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

  # ==========================================================================
  # Publish every workspace crate to crates.io
  # ==========================================================================
  # Publishes ALL workspace members — the reusable libraries, the Apple-platform
  # VM family, the app binaries, and the rpc crates. Run with `--no-verify`:
  # four crates embed files that live outside their own package directory, so
  # the isolated per-crate verify build can't see them —
  #   - arcbox-core / -cli / -daemon `include_str!` the repo-root `assets.lock`
  #     (and -cli also the helper `.plist` under bundle/);
  #   - arcbox-grpc's build.rs reads `../arcbox-protocol/proto`.
  # `--no-verify` skips that build and packages + uploads the source as-is — the
  # same way arcbox-grpc was already published. The whole workspace is compiled
  # green by the CI build job, so the per-crate verify build is redundant safety
  # here, not new coverage. cargo still resolves the dependency graph and uploads
  # in dependency order via a local temp registry, so unpublished inter-deps
  # resolve. arcbox-hv is excluded: it releases on its own cadence, usually
  # already exists at its pinned version, and depends on no workspace crate, so
  # it can always be published by itself. arcbox-helper is NOT excluded even
  # though its cadence is equally manual — it depends on arcbox-constants /
  # -logging / -route at the workspace version, so a standalone publish of it
  # cannot resolve until those are on the registry, and those go up in this
  # pass. Excluding it deadlocked the publish the moment its pin moved ahead of
  # crates.io (#613 bumped it to 1.1.0): arcbox-core requires `arcbox-helper
  # ^1.1.0`, which then existed in neither the registry nor the temp one.
  # Platform-agnostic (no compilation happens), so it runs on
  # ubuntu. Manual binary rebuilds only republish when explicitly requested.
  publish-crates:
    name: Publish crates to crates.io
    if: github.event_name == 'push' || inputs.publish_crates
    needs: version
    runs-on: ubuntu-latest
    # Mostly spent asleep: crates.io allows about one update per minute to an
    # existing crate, so a ~50-member workspace cannot finish faster than the
    # registry lets it. 45 minutes was under that floor.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.version }}

      - name: Setup Rust
        # @stable resolves to the latest stable at run time; coordinated
        # multi-package publishing needs cargo >= 1.90.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-publish-
            ${{ runner.os }}-cargo-

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_TERM_COLOR: never
        # One coordinated publish of the whole workspace: cargo packages every
        # member, resolves inter-deps via a local temp registry, then uploads in
        # dependency order, waiting for the index between uploads. --no-verify:
        # see the note above (crates that embed out-of-tree workspace files).
        #
        # crates.io limits updates to EXISTING crates to a burst and then about
        # one per minute, and this workspace has ~50 members — so a release is
        # always going to spend most of an hour waiting, and the retry loop is
        # load-bearing rather than a safety net. Cargo cannot resume a partial
        # publish, so two things keep the loop from going quadratic:
        #
        # Every crate this attempt got onto the index is excluded from the next
        # one, harvested from cargo's own `Uploaded` lines and from the
        # `already exists` error. Discovering them one-per-pass instead (each
        # costing a full ~50-crate packaging run) is what made v0.6.8 and
        # v0.6.9 exhaust their budget with three crates still unpublished.
        #
        # And the wait comes from the server: the 429 body carries `Please try
        # again after <date>`. A flat sleep either overshoots it or wakes too
        # early and burns an attempt — v0.6.9's log has a retry sleeping 60s
        # against a limit that had 4 seconds left on it.
        #
        # Only rate limits are retried; any other error fails immediately.
        run: |
          excludes=(--exclude arcbox-hv)
          rate_limit_attempts=0
          max_attempts=60

          while true; do
            set +e
            output=$(cargo publish --workspace "${excludes[@]}" --no-verify --locked 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"

            if (( status == 0 )); then
              echo "crates.io publish complete"
              exit 0
            fi

            # Harvest everything now on the index, so the next attempt packages
            # strictly less than this one did.
            harvested=0
            while read -r crate; do
              [[ -n $crate ]] || continue
              excludes+=(--exclude "$crate")
              harvested=$(( harvested + 1 ))
              echo "::notice::$crate is on the index; excluded from the next attempt"
            done < <(printf '%s\n' "$output" |
              sed -n -E 's/^[[:space:]]*(Uploaded|error: crate) ([^ @]+)[ @].*/\2/p' |
              sort -u)

            if [[ $output == *"429"* ]]; then
              ((rate_limit_attempts += 1))
              if (( rate_limit_attempts >= max_attempts )); then
                echo "::error::crates.io publish did not complete after $rate_limit_attempts rate-limit retries"
                exit 1
              fi

              # Sleep until the server says the next update is allowed. Clamped
              # so a malformed or stale date cannot stall or spin the job.
              retry_after=$(printf '%s\n' "$output" |
                sed -n -E 's/.*Please try again after ([^)]*GMT).*/\1/p' | tail -1)
              delay=60
              if [[ -n $retry_after ]] && target=$(date -u -d "$retry_after" +%s 2>/dev/null); then
                delay=$(( target - $(date -u +%s) + 5 ))
              fi
              (( delay < 5 )) && delay=5
              (( delay > 300 )) && delay=300

              echo "::notice::crates.io rate-limited; retrying in ${delay}s ($rate_limit_attempts/$max_attempts)"
              sleep "$delay"
              continue
            fi

            if (( harvested > 0 )); then
              echo "::notice::resuming with the remaining workspace crates"
              continue
            fi

            echo "::error::crates.io publish failed with a non-rate-limit error"
            exit "$status"
          done

  # ==========================================================================
  # Build + sign macOS ARM64 host binaries
  # ==========================================================================
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Protobuf compiler
        timeout-minutes: 5
        run: brew install protobuf

      # Restore only. A cache saved here lands in this tag's scope, and GitHub
      # does not let one tag read another tag's caches — every release would
      # save a few GB that nothing can ever read. The entry this restores is
      # written by ci.yml's `warm-release-cache` job on master, which is a
      # scope tags *can* read.
      #
      # No `${{ runner.os }}-cargo-` fallback: that key belongs to CI's debug
      # cache, and a debug `target/` shares nothing with a release build beyond
      # the registry download. Matching it made the build look cached while it
      # recompiled the whole dependency graph — which is how v0.6.4 hit the
      # old 15-minute step timeout and shipped a release with no assets.
      - name: Restore release build cache
        id: cargo_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Report cache state
        run: |
          echo "Exact release-cache hit: ${{ steps.cargo_cache.outputs.cache-hit }}"
          echo "Restored from: ${{ steps.cargo_cache.outputs.cache-matched-key }}"

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain.
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate.
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to access the key without UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list.
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Verify.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode \
            > "$PROFILE_DIR/arcbox-daemon.provisionprofile"

      # 40 minutes, not 15. The warm cache carries the dependency graph but is
      # keyed on Cargo.lock alone, so every workspace member still compiles
      # here — and those are not cheap (arcbox-api alone ran past six minutes
      # on v0.6.4). A release must not fail for being slow; it is the timeout
      # of last resort, not a budget.
      - name: Build arcbox binaries (release)
        timeout-minutes: 40
        run: cargo build --release --locked -p arcbox-cli -p arcbox-daemon -p arcbox-helper

      - name: Codesign arcbox-daemon
        run: |
          codesign --force --options runtime \
            --identifier com.arcboxlabs.desktop.daemon \
            --entitlements bundle/arcbox.entitlements \
            --sign "Developer ID Application: ArcBox, Inc. ($APPLE_TEAM_ID)" \
            target/release/arcbox-daemon
          codesign -v --deep --strict target/release/arcbox-daemon

      - name: Codesign arcbox-helper
        run: |
          codesign --force --options runtime \
            --identifier com.arcboxlabs.desktop.helper \
            --sign "Developer ID Application: ArcBox, Inc. ($APPLE_TEAM_ID)" \
            target/release/arcbox-helper
          codesign -v --deep --strict target/release/arcbox-helper

      - name: Codesign abctl
        run: |
          codesign --force --options runtime \
            --identifier com.arcboxlabs.desktop.cli \
            --sign "Developer ID Application: ArcBox, Inc. ($APPLE_TEAM_ID)" \
            target/release/abctl
          codesign -v --deep --strict target/release/abctl

      - name: Verify artifacts
        run: |
          echo "=== Build artifacts ==="
          for bin in abctl arcbox-daemon arcbox-helper; do
            ls -lh "target/release/$bin"
            file "target/release/$bin"
            codesign -d -v "target/release/$bin"
            echo
          done

      - name: Upload host binaries
        uses: actions/upload-artifact@v4
        with:
          name: host-binaries-darwin-arm64
          path: |
            target/release/abctl
            target/release/arcbox-daemon
            target/release/arcbox-helper
            bundle/arcbox.entitlements
            bundle/com.arcboxlabs.desktop.helper.plist
          retention-days: 5

  # ==========================================================================
  # Build guest binaries (Linux, cross-compiled via musl): arcbox-agent (the
  # System VM agent) and vm-agent (the sandbox microVM init, staged by the
  # daemon next to arcbox-agent — see app/arcbox-daemon/src/startup/assets.rs).
  # ==========================================================================
  build-agent:
    name: Build guest binaries (Linux musl)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl

      - name: Install musl cross-compiler and protobuf
        run: brew install FiloSottile/musl-cross/musl-cross protobuf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-agent-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-agent-musl-

      - name: Build guest binaries
        timeout-minutes: 10
        run: |
          cargo build --release --locked -p arcbox-agent --target aarch64-unknown-linux-musl
          cargo build --release --locked -p arcbox-vm --bin vm-agent --target aarch64-unknown-linux-musl

      - name: Verify artifacts
        run: |
          for bin in arcbox-agent vm-agent; do
            ls -lh "target/aarch64-unknown-linux-musl/release/$bin"
            file "target/aarch64-unknown-linux-musl/release/$bin"
          done

      - name: Upload guest binaries
        uses: actions/upload-artifact@v4
        with:
          name: agent-binary-linux-arm64
          path: |
            target/aarch64-unknown-linux-musl/release/arcbox-agent
            target/aarch64-unknown-linux-musl/release/vm-agent
          retention-days: 5

  # ==========================================================================
  # Package tarball and attach to GitHub Release
  # ==========================================================================
  package-and-release:
    name: Package & Upload Release
    needs: [version, build-macos-arm64, build-agent]
    runs-on: ubuntu-latest
    # contents: read is for the checkout below. The releases API is spoken to
    # with the app token instead — see the token step.
    permissions:
      contents: read

    steps:
      # release-please cuts the release as a draft (see release-please-config
      # .json) and does it as this app. GITHUB_TOKEN cannot modify another
      # integration's draft — arcbox-desktop learned that the hard way on
      # v1.34.5, taking a 403 on the update after finding the draft fine. So
      # publish as the app that owns it.
      #
      # Narrowed to this repository and to contents, because the job around it
      # was just dropped to `contents: read` — which makes this the only
      # elevated credential in scope, and an un-narrowed installation token
      # carries every permission the app holds in every repo it is installed
      # on. Flipping a draft to published needs contents: write here, nothing
      # else.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          repositories: arcbox
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download host binaries
        uses: actions/download-artifact@v4
        with:
          name: host-binaries-darwin-arm64
          path: artifacts/host/

      - name: Download agent binary
        uses: actions/download-artifact@v4
        with:
          name: agent-binary-linux-arm64
          path: artifacts/agent/

      - name: Create desktop tarball
        run: cargo xtask release package-tarball --version "${{ needs.version.outputs.version }}"

      # `draft: false` is what publishes it: the action uploads the tarball into
      # the draft first and flips it afterwards. A build that fails before this
      # point therefore leaves a draft, not the assetless release v0.6.4 left
      # sitting at the top of the releases page for eight hours.
      - name: Publish GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ needs.version.outputs.version }}
          draft: false
          files: |
            *.tar.gz
            *.tar.gz.sha256

  # ==========================================================================
  # Sync shipped issues to Linear Releases (continuous pipeline)
  #
  # Runs after the binaries are published, so each Linear release records what
  # actually shipped to Homebrew/CLI users — not just what merged. Issues are
  # associated by scanning commits since the previous Linear release for PR
  # references (#NNN, which Linear resolves to their linked issues) and ABX-123
  # identifiers. Requires the LINEAR_ACCESS_KEY secret (this pipeline's access
  # key, generated in Linear → Settings → Releases; not a personal API key).
  # ==========================================================================
  linear-release:
    name: Sync Linear Release
    needs: [version, package-and-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for commit-range scanning

      - uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          version: ${{ needs.version.outputs.version }}
          links: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.version }}

  # ==========================================================================
  # Bump the daemon arcbox-desktop embeds, once this release is installable.
  #
  # This used to fire from Release Please the moment a tag was cut, which meant
  # desktop was told about a version whose binaries did not exist yet. v0.6.4
  # is what that costs: the macOS build timed out, desktop was bumped anyway,
  # and its DMG build then failed on a release with no assets. Gating on
  # package-and-release makes the announcement mean "downloadable".
  #
  # This job only announces the tag. Writing arcbox.version is half a bump —
  # the generated Swift gRPC client is pinned to the same ref and desktop CI
  # rejects a PR where the two disagree — and regenerating that client needs
  # macOS and Xcode. So arcbox-desktop owns the bump in its own `Bump ArcBox`
  # workflow and this dispatches it. Dispatch is fire-and-forget: a failure
  # there surfaces in that repo's Actions tab, not in this release run.
  # ==========================================================================
  update-desktop:
    name: Update arcbox-desktop
    needs: [version, package-and-release]
    # Deliberately not gated on the trigger. workflow_dispatch is how a release
    # that died mid-way gets recovered — the v0.6.4 case this job exists for —
    # and gating on `push` would re-attach the assets on that path and then
    # leave desktop un-bumped, silently. `needs: package-and-release` already
    # means the binaries are attached, which is the condition that matters. A
    # redundant bump PR is cheap; a missing one is what cost us a release.
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          repositories: arcbox-desktop
          # The bump workflow mints its own token for the branch and the PR;
          # this one only has to start it.
          permission-actions: write

      # The tag is free-form on the workflow_dispatch path and flows straight
      # into the bump, so recovering a superseded tag would propose moving
      # desktop's arcbox.version *backwards*. A redundant bump is cheap; a
      # downgrade is not. Only the newest release announces itself.
      - name: Dispatch the arcbox-desktop bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          latest=$(gh release view --json tagName --jq .tagName)
          if [ "$TAG" != "$latest" ]; then
            echo "::notice::$TAG is superseded by $latest; not bumping desktop backwards"
            exit 0
          fi
          gh workflow run bump-arcbox.yml \
            --repo arcboxlabs/arcbox-desktop \
            --ref master \
            --field version="$TAG"
