name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.5)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  APPLE_TEAM_ID: "422ACSY6Y5"

jobs:
  # ==========================================================================
  # Determine version (shared by all jobs)
  # ==========================================================================
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

  # ==========================================================================
  # Publish every workspace crate to crates.io
  # ==========================================================================
  # Publishes ALL workspace members — the reusable libraries, the Apple-platform
  # VM family, the app binaries, and the rpc crates. Run with `--no-verify`:
  # four crates embed files that live outside their own package directory, so
  # the isolated per-crate verify build can't see them —
  #   - arcbox-core / -cli / -daemon `include_str!` the repo-root `assets.lock`
  #     (and -cli also the helper `.plist` under bundle/);
  #   - arcbox-grpc's build.rs reads `../arcbox-protocol/proto`.
  # `--no-verify` skips that build and packages + uploads the source as-is — the
  # same way arcbox-grpc was already published. The whole workspace is compiled
  # green by the CI build job, so the per-crate verify build is redundant safety
  # here, not new coverage. cargo still resolves the dependency graph and uploads
  # in dependency order via a local temp registry, so unpublished inter-deps
  # resolve. arcbox-hv has its own release cadence and may already exist at
  # its pinned version, so exclude it from the coordinated workspace publish.
  # Platform-agnostic (no compilation happens), so it runs on ubuntu. Skipped on
  # workflow_dispatch (manual binary rebuilds must not republish).
  publish-crates:
    name: Publish crates to crates.io
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        # @stable resolves to the latest stable at run time; coordinated
        # multi-package publishing needs cargo >= 1.90.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-publish-
            ${{ runner.os }}-cargo-

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # One coordinated publish of the whole workspace: cargo packages every
        # member, resolves inter-deps via a local temp registry, then uploads in
        # dependency order, waiting for the index between uploads. --no-verify:
        # see the note above (crates that embed out-of-tree workspace files).
        #
        # crates.io rate-limits bulk updates to existing crates (HTTP 429 after
        # a burst), and the workspace has ~50 members — a single pass never gets
        # through. Retry with backoff: cargo skips crates already published at
        # this version, so each pass uploads whatever the refill allows until
        # the whole workspace is up. Only a persistent non-rate-limit failure
        # exhausts the attempts and fails the job.
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if cargo publish --workspace --exclude arcbox-hv --no-verify --locked; then
              echo "crates.io publish complete after $i attempt(s)"
              exit 0
            fi
            echo "::notice::crates.io publish attempt $i/$attempts incomplete (likely rate-limited); backing off 60s"
            sleep 60
          done
          echo "::error::crates.io publish did not complete after $attempts attempts"
          exit 1

  # ==========================================================================
  # Build + sign macOS ARM64 host binaries
  # ==========================================================================
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Protobuf compiler
        timeout-minutes: 5
        run: brew install protobuf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain.
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate.
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to access the key without UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list.
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Verify.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode \
            > "$PROFILE_DIR/arcbox-daemon.provisionprofile"

      - name: Build arcbox binaries (release)
        timeout-minutes: 15
        run: cargo build --release --locked -p arcbox-cli -p arcbox-daemon -p arcbox-helper

      - name: Codesign arcbox-daemon
        run: |
          codesign --force --options runtime \
            --identifier com.arcboxlabs.desktop.daemon \
            --entitlements bundle/arcbox.entitlements \
            --sign "Developer ID Application: ArcBox, Inc. ($APPLE_TEAM_ID)" \
            target/release/arcbox-daemon
          codesign -v --deep --strict target/release/arcbox-daemon

      - name: Codesign arcbox-helper
        run: |
          codesign --force --options runtime \
            --identifier com.arcboxlabs.desktop.helper \
            --sign "Developer ID Application: ArcBox, Inc. ($APPLE_TEAM_ID)" \
            target/release/arcbox-helper
          codesign -v --deep --strict target/release/arcbox-helper

      - name: Codesign abctl
        run: |
          codesign --force --options runtime \
            --identifier com.arcboxlabs.desktop.cli \
            --sign "Developer ID Application: ArcBox, Inc. ($APPLE_TEAM_ID)" \
            target/release/abctl
          codesign -v --deep --strict target/release/abctl

      - name: Verify artifacts
        run: |
          echo "=== Build artifacts ==="
          for bin in abctl arcbox-daemon arcbox-helper; do
            ls -lh "target/release/$bin"
            file "target/release/$bin"
            codesign -d -v "target/release/$bin"
            echo
          done

      - name: Upload host binaries
        uses: actions/upload-artifact@v4
        with:
          name: host-binaries-darwin-arm64
          path: |
            target/release/abctl
            target/release/arcbox-daemon
            target/release/arcbox-helper
            bundle/arcbox.entitlements
            bundle/com.arcboxlabs.desktop.helper.plist
          retention-days: 5

  # ==========================================================================
  # Build guest binaries (Linux, cross-compiled via musl): arcbox-agent (the
  # System VM agent) and vm-agent (the sandbox microVM init, staged by the
  # daemon next to arcbox-agent — see app/arcbox-daemon/src/startup/assets.rs).
  # ==========================================================================
  build-agent:
    name: Build guest binaries (Linux musl)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl

      - name: Install musl cross-compiler and protobuf
        run: brew install FiloSottile/musl-cross/musl-cross protobuf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-agent-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-agent-musl-

      - name: Build guest binaries
        timeout-minutes: 10
        run: |
          cargo build --release --locked -p arcbox-agent --target aarch64-unknown-linux-musl
          cargo build --release --locked -p arcbox-vm --bin vm-agent --target aarch64-unknown-linux-musl

      - name: Verify artifacts
        run: |
          for bin in arcbox-agent vm-agent; do
            ls -lh "target/aarch64-unknown-linux-musl/release/$bin"
            file "target/aarch64-unknown-linux-musl/release/$bin"
          done

      - name: Upload guest binaries
        uses: actions/upload-artifact@v4
        with:
          name: agent-binary-linux-arm64
          path: |
            target/aarch64-unknown-linux-musl/release/arcbox-agent
            target/aarch64-unknown-linux-musl/release/vm-agent
          retention-days: 5

  # ==========================================================================
  # Package tarball and attach to GitHub Release
  # ==========================================================================
  package-and-release:
    name: Package & Upload Release
    needs: [version, build-macos-arm64, build-agent]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download host binaries
        uses: actions/download-artifact@v4
        with:
          name: host-binaries-darwin-arm64
          path: artifacts/host/

      - name: Download agent binary
        uses: actions/download-artifact@v4
        with:
          name: agent-binary-linux-arm64
          path: artifacts/agent/

      - name: Create desktop tarball
        run: cargo xtask release package-tarball --version "${{ needs.version.outputs.version }}"

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          files: |
            *.tar.gz
            *.tar.gz.sha256

  # ==========================================================================
  # Sync shipped issues to Linear Releases (continuous pipeline)
  #
  # Runs after the binaries are published, so each Linear release records what
  # actually shipped to Homebrew/CLI users — not just what merged. Issues are
  # associated by scanning commits since the previous Linear release for PR
  # references (#NNN, which Linear resolves to their linked issues) and ABX-123
  # identifiers. Requires the LINEAR_ACCESS_KEY secret (this pipeline's access
  # key, generated in Linear → Settings → Releases; not a personal API key).
  # ==========================================================================
  linear-release:
    name: Sync Linear Release
    needs: [version, package-and-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for commit-range scanning

      - uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          version: ${{ needs.version.outputs.version }}
          links: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.version }}
