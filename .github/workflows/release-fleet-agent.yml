name: Fleet Agent Release

# Builds and publishes arcbox-fleet-agent on its own cadence, independent of
# the main arcbox release train. macOS builds run natively on Apple Silicon and
# Intel runners. Assets are raw binaries (plus .sha256 files),
# named arcbox-fleet-agent-<os>-<arch> in the fleet capability vocabulary —
# the download URL is a pure function of (tag, host_os, host_arch), which is
# exactly what the gateway constructs for AgentUpdate.binary_url.

on:
  push:
    tags:
      - 'fleet-agent-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. fleet-agent-v0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  APPLE_TEAM_ID: "422ACSY6Y5"

# Build jobs only read the repo; the publish job re-declares the
# contents: write it needs to attach release assets.
permissions:
  contents: read

jobs:
  version:
    name: Determine tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building tag: $TAG"

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: version
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: amd64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      # Check out the tag being released, not the dispatching ref — a
      # workflow_dispatch from master must still build the tag's tree, or
      # the published assets would not match the release they're attached to.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Protobuf compiler
        timeout-minutes: 5
        run: brew install protobuf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-fleet-agent-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fleet-agent-${{ matrix.arch }}-

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain.
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate.
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to access the key without UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list.
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Verify.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build arcbox-fleet-agent (release)
        timeout-minutes: 15
        run: cargo build --release --locked -p arcbox-fleet-agent

      - name: Codesign arcbox-fleet-agent
        run: |
          codesign --force --options runtime \
            --identifier com.arcboxlabs.fleet.agent \
            --sign "Developer ID Application: ArcBox, Inc. ($APPLE_TEAM_ID)" \
            target/release/arcbox-fleet-agent
          codesign -v --deep --strict target/release/arcbox-fleet-agent

      - name: Verify artifact
        run: |
          ls -lh target/release/arcbox-fleet-agent
          file target/release/arcbox-fleet-agent
          codesign -d -v target/release/arcbox-fleet-agent

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: fleet-agent-binary-darwin-${{ matrix.arch }}
          path: target/release/arcbox-fleet-agent
          retention-days: 5

  # Cross-compile both Linux targets from a single x86_64 runner using the
  # musl-cross-make prebuilt toolchains from musl.cc — the same toolchain
  # FiloSottile's Homebrew tap builds on macOS, with the same tool naming
  # (${target}-linux-musl-{gcc,ar,ld}) and the same fully-static defaults.
  # Keeps `.cargo/config.toml` as the single source of truth across host OSes
  # and avoids Ubuntu `musl-tools`' PIE-against-ld-musl default.
  build-linux:
    name: Build Linux ${{ matrix.arch }}
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            musl_prefix: x86_64-linux-musl
            # sha256 of https://musl.cc/x86_64-linux-musl-cross.tgz
            # (Last-Modified: 2021-11-23). The digest is also baked into
            # the cache key below, so refreshing the tarball auto-
            # invalidates any previously-cached toolchain.
            musl_sha256: c5d410d9f82a4f24c549fe5d24f988f85b2679b452413a9f7e5f7b956f2fe7ea
          - arch: arm64
            target: aarch64-unknown-linux-musl
            musl_prefix: aarch64-linux-musl
            # sha256 of https://musl.cc/aarch64-linux-musl-cross.tgz
            musl_sha256: c909817856d6ceda86aa510894fa3527eac7989f0ef6e87b5721c58737a06c38
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Same tag-ref discipline as build-macos.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache musl-cross toolchain
        # Cache key includes the pinned sha256, so bumping the digest
        # auto-invalidates any previously-cached toolchain — no coupled
        # version bump required.
        id: musl-cross-cache
        uses: actions/cache@v4
        with:
          path: /opt/${{ matrix.musl_prefix }}-cross
          key: musl-cross-${{ matrix.musl_prefix }}-${{ matrix.musl_sha256 }}

      - name: Install musl-cross toolchain
        # Downloaded from our own vendored release (mirror of the same
        # musl.cc tarballs, verified by sha256 at upload time). Points off
        # musl.cc's single-maintainer host — it's been unreliable from
        # GHA runners — and keeps release bandwidth on GitHub's CDN.
        # Pinned by sha256: this toolchain links the released binaries and
        # Linux release artifacts aren't codesigned, so a bad tarball would
        # silently backdoor every Linux release. The digest is also baked
        # into the cache key above, so bumping the tarball auto-invalidates
        # any previously-cached toolchain.
        if: steps.musl-cross-cache.outputs.cache-hit != 'true'
        env:
          MUSL_CROSS_RELEASE: musl-cross-2021-11-23
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors \
            -o /tmp/musl-cross.tgz \
            "https://github.com/${{ github.repository }}/releases/download/${MUSL_CROSS_RELEASE}/${{ matrix.musl_prefix }}-cross.tgz"
          echo "${{ matrix.musl_sha256 }}  /tmp/musl-cross.tgz" | sha256sum -c -
          sudo tar -xf /tmp/musl-cross.tgz -C /opt
          rm /tmp/musl-cross.tgz

      - name: Add musl-cross to PATH and install protoc
        run: |
          echo "/opt/${{ matrix.musl_prefix }}-cross/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-fleet-agent-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fleet-agent-${{ matrix.arch }}-

      - name: Build arcbox-fleet-agent
        timeout-minutes: 10
        run: cargo build --release --locked -p arcbox-fleet-agent --target ${{ matrix.target }}

      - name: Verify artifact is fully static
        # A stray ELF interpreter (PT_INTERP) means the binary needs a
        # dynamic loader at runtime — defeats the point of a musl build.
        # Regression-catch it here.
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/arcbox-fleet-agent
          ls -lh "$bin"
          file "$bin"
          if readelf -l "$bin" | grep -q INTERP; then
            echo "::error::binary has PT_INTERP; not fully static"
            readelf -l "$bin" | grep -E '(INTERP|Requesting)'
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: fleet-agent-binary-linux-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/arcbox-fleet-agent
          retention-days: 5

  # Mirror the fleet-agent binaries to the release CDN
  # (release.arcboxcdn.com, backed by Backblaze B2). This is the primary
  # distribution channel the gateway resolves for AgentUpdate.binary_url —
  # the URL is a pure function of (version, host_os, host_arch):
  #
  #   https://release.arcboxcdn.com/runner/fleet-agent/${version}/arcbox-fleet-agent-${os}-${arch}
  #
  # Layout: `runner/` is the top-level namespace for runner-side
  # components; `fleet-agent/` is this specific component, leaving room
  # for sibling components at `runner/<other>/...` without collision.
  # `${version}` is the git tag with the `fleet-agent-` prefix stripped
  # (so `fleet-agent-v0.1.0` → `v0.1.0`). `--size-only` on the sync is
  # safe because the artifacts under a version are immutable;
  # re-releasing the same version is a workflow re-dispatch, not a
  # content-differs replace.
  upload-cdn:
    name: Upload to CDN
    needs: [version, build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: fleet-agent-binary-*
          path: artifacts/

      - name: Stage assets
        id: stage
        run: |
          set -eu
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#fleet-agent-}"
          mkdir -p "cdn-staging/runner/fleet-agent/${VERSION}"
          for platform in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            cargo xtask release fleet-asset \
              --platform "$platform" \
              --binary "artifacts/fleet-agent-binary-$platform/arcbox-fleet-agent"
          done
          mv arcbox-fleet-agent-* "cdn-staging/runner/fleet-agent/${VERSION}/"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "=== CDN staging ==="
          find "cdn-staging/runner/fleet-agent/${VERSION}" -type f | sort

      - name: Upload to B2 (size-only, immutable)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_B2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_B2_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.RELEASE_B2_REGION }}
        run: |
          VERSION="${{ steps.stage.outputs.version }}"
          aws s3 sync \
            "cdn-staging/runner/fleet-agent/${VERSION}/" \
            "s3://${{ secrets.RELEASE_B2_BUCKET }}/runner/fleet-agent/${VERSION}/" \
            --endpoint-url "https://s3.${{ secrets.RELEASE_B2_REGION }}.backblazeb2.com" \
            --size-only

      - name: Verify CDN URLs
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.stage.outputs.version }}
        with:
          script: |
            const { VERSION } = process.env;
            await new Promise((r) => setTimeout(r, 5000));
            const platforms = ['darwin-arm64', 'darwin-amd64', 'linux-amd64', 'linux-arm64'];
            let failed = false;
            for (const p of platforms) {
              const url = `https://release.arcboxcdn.com/runner/fleet-agent/${VERSION}/arcbox-fleet-agent-${p}`;
              let status = 0;
              try {
                status = (await fetch(url, { method: 'HEAD', signal: AbortSignal.timeout(15000) })).status;
              } catch { /* status stays 0 */ }
              core.info(`CDN check: ${url} -> HTTP ${status}`);
              if (status !== 200) {
                core.warning(`CDN returned HTTP ${status} for ${url}`);
                failed = true;
              }
            }
            if (failed) core.warning('Some CDN URLs did not return HTTP 200 — check propagation');

  publish:
    name: Publish Release Assets
    needs: [version, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Same tag-ref discipline as the build jobs, so the xtask staging the
      # assets is the tag's own.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: fleet-agent-binary-*
          path: artifacts/

      - name: Prepare release assets
        run: |
          set -eu
          for platform in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            cargo xtask release fleet-asset \
              --platform "$platform" \
              --binary "artifacts/fleet-agent-binary-$platform/arcbox-fleet-agent"
          done
          ls -lh arcbox-fleet-agent-*

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          make_latest: false
          files: |
            arcbox-fleet-agent-*
