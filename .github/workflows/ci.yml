name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

# Every job only reads the repo; nothing here writes back through the API.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  proto-breaking:
    name: Proto Breaking-Change Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The host↔agent channel has no runtime version negotiation beyond the
    # ping handshake, so proto evolution must stay wire-compatible and
    # additive-only. PRs compare against their base branch; branch pushes
    # compare against the branch's previous state on origin.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch for comparison
        env:
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF" || true

      - name: Install buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true

      - name: Check for breaking proto changes against the base branch
        env:
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          buf breaking rpc/arcbox-protocol/proto \
            --against ".git#branch=origin/$BASE_REF,subdir=rpc/arcbox-protocol/proto"

  ci:
    name: Build, Lint, and Test
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Rust
        # The `toolchain` input selects the toolchain (not the action ref),
        # so the SHA pin does not freeze the Rust version.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable

      - name: Install Protobuf compiler
        run: brew install protobuf

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint Swift shim (swift-format, strict)
        run: xcrun swift-format lint --strict --parallel --recursive virt/arcbox-vz/shim

      - name: Smoke test cargo xtask alias
        run: cargo xtask --help

      - name: Run clippy
        run: cargo clippy --workspace --exclude arcbox-agent -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --exclude arcbox-agent

      - name: Run tests
        run: cargo test --workspace --exclude arcbox-agent

      - name: Code sign arcbox-daemon (adhoc, for smoke test only)
        run: |
          codesign --force --options runtime \
            --entitlements bundle/arcbox.dev.entitlements \
            -s - target/debug/arcbox-daemon

      - name: Smoke test arcbox CLI
        run: ./target/debug/abctl --help

      - name: Smoke test arcbox daemon
        run: ./target/debug/arcbox-daemon --help

      - name: Smoke test arcbox helper
        run: ./target/debug/arcbox-helper --help

  # The engine layer and the net stack under it promise platform
  # neutrality (architecture charter, company repo; engine/AGENTS.md: "every
  # crate must compile and pass unit tests on Linux as well as macOS"): this
  # compile gate keeps darwin-only deps target-gated so a Linux host build
  # never rots again. `--all-targets` is load-bearing: a plain `cargo check`
  # skips test/example/bench targets, so a macOS-only symbol reintroduced
  # into a `#[cfg(test)]` module (as happened once already) would pass the
  # gate while still breaking `cargo test` on Linux. A second step repeats
  # the check on aarch64-unknown-linux-musl (the real cross-compile target,
  # see root CLAUDE.md "Guest Agent Cross-Compilation") because gnu/musl and
  # x86_64/aarch64 each pick different concrete types for a few libc
  # primitives (e.g. `c_char`'s signedness is arch-, not libc-, driven) that
  # the gnu-only first step can't exercise; scoped to arcbox-net + splicetcp +
  # arcbox-hypervisor + arcbox-virtio-net — arcbox-image is the one exclusion,
  # since its TLS deps pull in `ring`, whose build script needs a musl C
  # cross-compiler this runner doesn't have. Scoped to the crates that
  # make the platform-neutrality promise — the workspace as a whole still
  # contains macOS-only crates (arcbox-vz, arcbox-vmnet). Extend the -p list
  # as engine/computer crates land.
  linux-engine:
    name: Linux engine-layer check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-linux-engine-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-engine-

      - name: Check engine-layer crates on Linux
        run: cargo check --all-targets -p arcbox-image -p arcbox-net -p splicetcp -p arcbox-hypervisor -p arcbox-virtio-net

      - name: Check engine-layer crates on aarch64-unknown-linux-musl
        run: cargo check --all-targets --target aarch64-unknown-linux-musl -p arcbox-net -p splicetcp -p arcbox-hypervisor -p arcbox-virtio-net

  # Pure proto-contract analysis — no Rust toolchain, no build. Runs in
  # parallel with `ci` on a cheap Linux runner. The desktop and agent
  # ship/self-update independently, so the control-plane wire contract must
  # only ever change additively; fail any PR that breaks it against the base
  # branch. PR-only, since "breaking against the branch being merged into" is
  # only defined for a PR.
  proto-compat:
    name: Control-plane proto compatibility
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}

      # Self-bootstrapping: inert until the proto first lands on the base
      # branch, so it never blocks the PR that introduces it.
      - name: Check for breaking changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          module=fleet/arcbox-fleet-control-proto
          git fetch --depth=1 origin "$BASE_REF"
          if git cat-file -e "FETCH_HEAD:$module/buf.yaml" 2>/dev/null; then
            buf breaking "$module" --against ".git#ref=FETCH_HEAD,subdir=$module"
          else
            echo "control-plane proto not yet on '$BASE_REF'; breaking check inactive"
          fi

  # The published SDKs live outside the cargo workspace, so the main `ci`
  # job never touches them. These run the same gates as the release
  # workflows (release-sdk-typescript.yml / release-sdk-python.yml), so a
  # PR cannot land a change that would only fail at publish time. No path
  # filter, matching this workflow's other jobs — both suites finish in
  # about a minute.
  sdk-typescript:
    name: SDK TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  sdk-python:
    name: SDK Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/python

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # uv pinned to the same range as pyproject.toml's uv_build
      # requirement and the publish gate (release-sdk-python.yml), so PR
      # validation and release run the same toolchain.
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '>=0.12.1,<0.13'

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run pyright

      - name: Check sync-tree lockstep
        run: uv run python scripts/gen_sync.py --check

      - name: Run tests
        run: uv run pytest

      - name: Build
        run: uv build

  # ==========================================================================
  # Warm the release-profile cache that Release Build restores.
  #
  # The release job runs on a tag, and a tag can only read caches from its own
  # ref or the default branch — never another tag's. So no matter how many
  # releases run, none of them can warm the next one; the cache has to be
  # written from master. Until it was, every release compiled ~300 dependency
  # crates from scratch (the `macOS-cargo-` fallback it landed on is CI's debug
  # cache above, which shares only the registry download with a release build).
  # That is what timed out on v0.6.4 and published a release with no assets.
  #
  # Keyed on Cargo.lock alone, so this does real work only when dependencies
  # move: the probe below turns every other master push into a ~30-second
  # no-op. macOS runners bill at 10x, and a per-commit key would also thrash
  # the repo's 10 GB cache budget — these entries run to several GB. The cost
  # is that workspace members are not in the cache and still compile at
  # release time; the release step's timeout accounts for that.
  # ==========================================================================
  warm-release-cache:
    name: Warm release cache
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # A real restore, not a lookup: on an exact hit the steps below all skip,
      # and on a miss the prefix key still lands a recent `target/` so the
      # build is incremental rather than ~300 crates from scratch on a runner
      # that bills at 10x. That miss is the common case, not the rare one —
      # the release PR runs `cargo update --workspace`, so every release moves
      # Cargo.lock and with it the exact key.
      - name: Restore the release cache
        id: probe
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Setup Rust
        if: steps.probe.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable

      - name: Install Protobuf compiler
        if: steps.probe.outputs.cache-hit != 'true'
        run: brew install protobuf

      # The same three packages Release Build compiles, so the dependency
      # graph in the cache is exactly the one it needs.
      - name: Build release binaries
        if: steps.probe.outputs.cache-hit != 'true'
        run: |
          echo "Restored from: ${{ steps.probe.outputs.cache-matched-key }}"
          cargo build --release --locked -p arcbox-cli -p arcbox-daemon -p arcbox-helper

      # Paths and key repeated verbatim from the probe above: workflow files
      # cannot factor them out, and cache/save must agree with cache/restore
      # exactly or the release job matches nothing.
      - name: Save release build cache
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
