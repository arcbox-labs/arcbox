name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  proto-breaking:
    name: Proto Breaking-Change Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The host↔agent channel has no runtime version negotiation beyond the
    # ping handshake, so proto evolution must stay wire-compatible and
    # additive-only. Compares the PR's protos against master.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch master for comparison
        run: git fetch origin master:refs/remotes/origin/master

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Check for breaking proto changes against master
        run: |
          buf breaking rpc/arcbox-protocol/proto \
            --against '.git#branch=origin/master,subdir=rpc/arcbox-protocol/proto'

  ci:
    name: Build, Lint, and Test
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Protobuf compiler
        run: brew install protobuf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Smoke test cargo xtask alias
        run: cargo xtask --help

      - name: Run clippy
        run: cargo clippy --workspace --exclude arcbox-agent -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --exclude arcbox-agent

      - name: Run tests
        run: cargo test --workspace --exclude arcbox-agent

      - name: Code sign arcbox-daemon (adhoc, for smoke test only)
        run: |
          codesign --force --options runtime \
            --entitlements bundle/arcbox.dev.entitlements \
            -s - target/debug/arcbox-daemon

      - name: Smoke test arcbox CLI
        run: ./target/debug/abctl --help

      - name: Smoke test arcbox daemon
        run: ./target/debug/arcbox-daemon --help

      - name: Smoke test arcbox helper
        run: ./target/debug/arcbox-helper --help
