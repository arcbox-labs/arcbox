name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

# Every job only reads the repo; nothing here writes back through the API.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  proto-breaking:
    name: Proto Breaking-Change Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The host↔agent channel has no runtime version negotiation beyond the
    # ping handshake, so proto evolution must stay wire-compatible and
    # additive-only. PRs compare against their base branch; branch pushes
    # compare against the branch's previous state on origin.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for comparison
        env:
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF" || true

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Check for breaking proto changes against the base branch
        env:
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          buf breaking rpc/arcbox-protocol/proto \
            --against ".git#branch=origin/$BASE_REF,subdir=rpc/arcbox-protocol/proto"

  ci:
    name: Build, Lint, and Test
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Protobuf compiler
        run: brew install protobuf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Smoke test cargo xtask alias
        run: cargo xtask --help

      - name: Run clippy
        run: cargo clippy --workspace --exclude arcbox-agent -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --exclude arcbox-agent

      - name: Run tests
        run: cargo test --workspace --exclude arcbox-agent

      - name: Code sign arcbox-daemon (adhoc, for smoke test only)
        run: |
          codesign --force --options runtime \
            --entitlements bundle/arcbox.dev.entitlements \
            -s - target/debug/arcbox-daemon

      - name: Smoke test arcbox CLI
        run: ./target/debug/abctl --help

      - name: Smoke test arcbox daemon
        run: ./target/debug/arcbox-daemon --help

      - name: Smoke test arcbox helper
        run: ./target/debug/arcbox-helper --help

  # Pure proto-contract analysis — no Rust toolchain, no build. Runs in
  # parallel with `ci` on a cheap Linux runner. The desktop and agent
  # ship/self-update independently, so the control-plane wire contract must
  # only ever change additively; fail any PR that breaks it against the base
  # branch. PR-only, since "breaking against the branch being merged into" is
  # only defined for a PR.
  proto-compat:
    name: Control-plane proto compatibility
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      # Self-bootstrapping: inert until the proto first lands on the base
      # branch, so it never blocks the PR that introduces it.
      - name: Check for breaking changes
        run: |
          base="${{ github.base_ref }}"
          module=fleet/arcbox-fleet-control-proto
          git fetch --depth=1 origin "$base"
          if git cat-file -e "FETCH_HEAD:$module/buf.yaml" 2>/dev/null; then
            buf breaking "$module" --against ".git#ref=FETCH_HEAD,subdir=$module"
          else
            echo "control-plane proto not yet on '$base'; breaking check inactive"
          fi
